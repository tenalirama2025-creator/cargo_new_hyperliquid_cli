[package]
name = "cargo_new_hyperliquid_cli"
version = "0.1.0"
authors = ["Venkateshwar Rao <tenalirama2025@gmail.com>"]
edition = "2021"
description = "A high-performance Rust CLI for the Hyperliquid decentralized exchange."

[[bin]]
name = "hypecli"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
tabwriter = "1"