[package]
name = "cargo_new_hyperliquid_cli"
version = "0.1.0"
authors = ["Venkateshwar Rao <tenalirama2025@gmail.com>"]
edition = "2021"
description = "A high-performance Rust CLI for the Hyperliquid decentralized exchange."

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.2"
# For WebSocket
async-tungstenite = { version = "0.20", features = ["tokio-runtime", "tokio-native-tls"] }
futures = "0.3"
